version: '3.8'

services:
  web:
    build: .
    container_name: python_crud_app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=tu_password
      - MYSQL_DB=tu_base_de_datos
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: tu_password
      MYSQL_DATABASE: tu_base_de_datos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: